name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del motor de premios y las gráficas
        run: node --test
      - name: El recolector compila
        run: python3 -m py_compile recolectores/actualizar.py recolectores/avisos.py recolectores/auditar.py recolectores/loterias/*.py
      - name: Pruebas del recolector (reintentos, ilegibles, tiempo, avisos)
        run: python3 -m unittest discover -s test -p "test_*.py"
