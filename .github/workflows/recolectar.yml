name: Recolectar y publicar

# Cada noche trae los sorteos nuevos de las fuentes oficiales, los guarda en datos/
# y vuelve a publicar la página en GitHub Pages. Sin servidor y sin claves.
# (Configura Pages con «Source: GitHub Actions».)
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = medianoche en Colombia, después de los sorteos
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herramientas de OCR (Cundinamarca y Manizales solo publican imágenes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-spa poppler-utils
          pip install --quiet pillow
      - name: Traer sorteos nuevos
        run: python3 recolectores/actualizar.py
      - name: Auditar una muestra (doble confirmación contra la fuente en vivo)
        continue-on-error: true
        run: python3 recolectores/auditar.py
      - name: Guardar datos y estado
        if: always()
        # Se guarda cada noche (el estado cambia siempre): así el repositorio nunca queda
        # inactivo 60 días, que es cuando GitHub apaga las tareas programadas.
        run: |
          git config user.name "cayo-recolector"
          git config user.email "cayo-recolector@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Datos: resultados del $(date -u +%F)"
          git pull --rebase --quiet origin main
          git push
      - name: Avisar por issue si una fuente falla o hay sorteos ilegibles
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 recolectores/avisos.py | while IFS=$'\t' read -r accion titulo texto; do
            abierto=$(gh issue list --state open --search "\"$titulo\" in:title" --json number,title --jq ".[] | select(.title==\"$titulo\") | .number" | head -1)
            if [ "$accion" = "ABRIR" ] && [ -z "$abierto" ]; then
              gh issue create --title "$titulo" --body "$(printf '%b' "$texto")"
            elif [ "$accion" = "CERRAR" ] && [ -n "$abierto" ]; then
              gh issue close "$abierto" --comment "$texto"
            fi
          done

  publicar:
    needs: recolectar
    if: always() && (needs.recolectar.result == 'success' || needs.recolectar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
